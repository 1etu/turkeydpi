[global]
enabled = true
enable_fragmentation = true
enable_jitter = false
log_level = "info"
json_logging = false

[[rules]]
name = "https-evasion"
enabled = true
priority = 100
transforms = ["fragment"]

[rules.match_criteria]
dst_ports = [443]
protocols = ["tcp"]

[[rules]]
name = "http-evasion"
enabled = true
priority = 90
transforms = ["fragment"]

[rules.match_criteria]
dst_ports = [80, 8080]
protocols = ["tcp"]

[[rules]]
name = "cloudflare-ranges"
enabled = false
priority = 110
transforms = ["fragment", "jitter"]

[rules.match_criteria]
dst_ip = ["104.16.0.0/12", "172.64.0.0/13"]
dst_ports = [443]
protocols = ["tcp"]

[limits]
max_flows = 10000
max_queue_size = 1000
max_memory_mb = 128
max_jitter_ms = 500
flow_timeout_secs = 120
log_rate_limit = 100

[transforms.fragment]
min_size = 1
max_size = 40
randomize = true

[transforms.resegment]
segment_size = 16
max_segments = 8

[transforms.jitter]
min_ms = 0
max_ms = 50
